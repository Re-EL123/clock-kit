<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#21396A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clock-Kit" />
    <title>Sign in — Clock-Kit</title>
    <script>
      try {
        if (sessionStorage.getItem('ck_splash_seen') === '1' && !/login\.html|\/kiosk/.test(location.pathname)) {
          document.documentElement.classList.add('ck-splash-skip');
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="%BASE_URL%splash.css" />
    <link rel="icon" href="%BASE_URL%assets/logo/clock-kit-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%assets/logo/clock-kit-icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%assets/logo/clock-kit-icon-180.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preload" as="image" href="%BASE_URL%assets/login/workplace.jpg" />
    <style>
      .auth-stage {
        background: #1a2438 url('%BASE_URL%assets/login/workplace.jpg') center / cover no-repeat;
      }
    </style>
  </head>
  <body class="auth-page">
    <div class="auth-stage" aria-hidden="true">
      <video
        class="auth-video"
        muted
        loop
        playsinline
        webkit-playsinline
        preload="none"
        poster="%BASE_URL%assets/login/workplace.jpg"
        data-src="%BASE_URL%assets/login/workplace.mp4"
      ></video>
    </div>
    <div id="ck-splash" class="ck-splash" role="dialog" aria-label="Clock-Kit">
      <div class="ck-splash-inner">
        <div class="clock-wrap splash-clock">
          <div class="clock-face" aria-hidden="true"></div>
        </div>
        <p class="ck-splash-wordmark"><span class="ck-navy">Clock</span><span class="ck-red">-Kit</span></p>
        <p class="ck-splash-tag">CLOCK IN. WORK ON. SUCCEED TOGETHER.</p>
      </div>
    </div>
    <div id="app"></div>
    <p class="auth-credit">
      Video by
      <a href="https://pixabay.com/users/km007_-23606303/?utm_source=link-attribution&utm_medium=referral&utm_campaign=video&utm_content=91744" rel="noopener noreferrer" target="_blank">Moses Justin</a>
      from
      <a href="https://pixabay.com//?utm_source=link-attribution&utm_medium=referral&utm_campaign=video&utm_content=91744" rel="noopener noreferrer" target="_blank">Pixabay</a>
    </p>
    <script>
      (function () {
        var video = document.querySelector('.auth-video');
        if (!video) return;
        var playInBrowserTab = false;
        try {
          playInBrowserTab = window.matchMedia('(display-mode: browser)').matches
            && window.navigator.standalone !== true;
        } catch (e) {}
        var saveData = window.navigator.connection && window.navigator.connection.saveData;
        var canPlay = playInBrowserTab
          && !saveData
          && !window.matchMedia('(prefers-reduced-motion: reduce)').matches
          && !window.matchMedia('(max-width: 720px)').matches
          && !window.matchMedia('(pointer: coarse)').matches;
        if (!canPlay) {
          video.remove();
          return;
        }
        var src = document.createElement('source');
        src.src = video.getAttribute('data-src');
        src.type = 'video/mp4';
        video.appendChild(src);
        video.preload = 'auto';
        var ready = function () { video.classList.add('is-ready'); };
        video.addEventListener('playing', ready, { once: true });
        video.addEventListener('canplay', ready, { once: true });
        var play = video.play();
        if (play && play.catch) play.catch(function () {});
      })();
    </script>
    <script src="%BASE_URL%splash-boot.js"></script>
    <script type="module" src="/src/js/panels/login.js"></script>
  </body>
</html>
